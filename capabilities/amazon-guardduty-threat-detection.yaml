naftiko: "1.0.0-alpha1"

info:
  label: Amazon GuardDuty Threat Detection
  description: >-
    Workflow capability for security teams using Amazon GuardDuty for AWS threat
    detection and response. Covers finding management, detector configuration,
    threat intelligence integration, and automated response workflows.
  tags:
    - Amazon GuardDuty
    - Threat Detection
    - Security Operations
    - Incident Response
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: amazon-guardduty
      location: ./shared/amazon-guardduty.yaml

  exposes:
    - type: rest
      port: 8085
      namespace: guardduty-threat-detection-api
      description: Unified REST API for Amazon GuardDuty threat detection operations.
      resources:
        - path: /v1/detectors
          name: detectors
          description: GuardDuty detector management
          operations:
            - method: GET
              name: list-detectors
              description: List all GuardDuty detectors
              call: amazon-guardduty.ListDetectors
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-detector
              description: Enable GuardDuty for an account
              call: amazon-guardduty.CreateDetector
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/findings
          name: findings
          description: Threat findings from GuardDuty analysis
          operations:
            - method: GET
              name: list-findings
              description: List threat findings
              call: amazon-guardduty.ListFindings
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: archive-findings
              description: Archive reviewed findings
              call: amazon-guardduty.ArchiveFindings
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/filters
          name: filters
          description: Finding suppression filters
          operations:
            - method: POST
              name: create-filter
              description: Create a finding filter
              call: amazon-guardduty.CreateFilter
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/threat-intel
          name: threat-intel
          description: Threat intelligence feeds
          operations:
            - method: GET
              name: list-threat-intel-sets
              description: List threat intelligence sets
              call: amazon-guardduty.ListThreatIntelSets
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9095
      namespace: guardduty-threat-detection-mcp
      transport: http
      description: MCP server for AI-assisted Amazon GuardDuty threat detection and response.
      tools:
        - name: list-detectors
          description: List all active GuardDuty detectors across the account
          hints:
            readOnly: true
            openWorld: true
          call: amazon-guardduty.ListDetectors
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-detector-status
          description: Get the configuration and status of a GuardDuty detector
          hints:
            readOnly: true
          call: amazon-guardduty.GetDetector
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-threat-findings
          description: List active threat findings detected by GuardDuty with severity filters
          hints:
            readOnly: true
          call: amazon-guardduty.ListFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-finding-details
          description: Get detailed information about specific threat findings including full context
          hints:
            readOnly: true
          call: amazon-guardduty.GetFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: archive-findings
          description: Archive threat findings that have been reviewed and resolved
          hints:
            readOnly: false
          call: amazon-guardduty.ArchiveFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-finding-filter
          description: Create a suppression filter to reduce noise from benign findings
          hints:
            readOnly: false
          call: amazon-guardduty.CreateFilter
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-finding-filters
          description: List all finding suppression filters
          hints:
            readOnly: true
          call: amazon-guardduty.ListFilters
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-trusted-ip-sets
          description: List trusted IP address sets excluded from threat detection
          hints:
            readOnly: true
          call: amazon-guardduty.ListIPSets
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-trusted-ip-set
          description: Create a trusted IP set to exclude known safe IPs from alerts
          hints:
            readOnly: false
          call: amazon-guardduty.CreateIPSet
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-threat-intel-sets
          description: List threat intelligence sets used for enhanced detection
          hints:
            readOnly: true
          call: amazon-guardduty.ListThreatIntelSets
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-findings-statistics
          description: Get finding statistics and severity counts for security posture overview
          hints:
            readOnly: true
          call: amazon-guardduty.GetFindingsStatistics
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-members
          description: List member accounts monitored by this GuardDuty administrator account
          hints:
            readOnly: true
          call: amazon-guardduty.ListMembers
          outputParameters:
            - type: object
              mapping: "$."
