naftiko: "1.0.0-alpha1"

info:
  label: Amazon GuardDuty
  description: Intelligent threat detection service using ML and threat intelligence to monitor AWS accounts, workloads, and data for malicious activity.
  tags:
    - Amazon GuardDuty
    - Security
    - Threat Detection
    - Machine Learning
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-guardduty
      baseUri: https://guardduty.amazonaws.com
      description: Amazon GuardDuty Threat Detection API
      authentication:
        type: bearer
        token: "{{AWS_AUTH_HEADER}}"
      resources:
        - name: detectors
          path: /detector
          description: GuardDuty detector management
          operations:
            - name: ListDetectors
              method: GET
              description: List all GuardDuty detectors
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateDetector
              method: POST
              description: Create a GuardDuty detector
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: GetDetector
              method: GET
              description: Get detector details
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: findings
          path: /detector/{detectorId}/findings
          description: Threat finding management
          operations:
            - name: ListFindings
              method: POST
              description: List threat findings for a detector
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: GetFindings
              method: POST
              description: Get details of specific findings
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: ArchiveFindings
              method: POST
              description: Archive findings that have been reviewed
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: filters
          path: /detector/{detectorId}/filter
          description: Finding filter management
          operations:
            - name: ListFilters
              method: GET
              description: List finding filters
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateFilter
              method: POST
              description: Create a finding filter
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: ip-sets
          path: /detector/{detectorId}/ipset
          description: Trusted IP set management
          operations:
            - name: ListIPSets
              method: GET
              description: List trusted IP sets
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateIPSet
              method: POST
              description: Create a trusted IP set
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: threat-intel
          path: /detector/{detectorId}/threatintelset
          description: Threat intelligence set management
          operations:
            - name: ListThreatIntelSets
              method: GET
              description: List threat intelligence sets
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8085
      namespace: guardduty-rest-api
      resources:
        - path: /v1/detectors
          name: detectors
          operations:
            - method: GET
              name: list-detectors
              description: List GuardDuty detectors
              call: amazon-guardduty.ListDetectors
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9095
      namespace: guardduty-mcp
      transport: http
      tools:
        - name: list-detectors
          description: List all GuardDuty detectors
          hints:
            readOnly: true
          call: amazon-guardduty.ListDetectors
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-findings
          description: List threat findings for a detector
          hints:
            readOnly: true
          call: amazon-guardduty.ListFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-findings
          description: Get detailed information about specific threat findings
          hints:
            readOnly: true
          call: amazon-guardduty.GetFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: archive-findings
          description: Archive reviewed threat findings
          hints:
            readOnly: false
          call: amazon-guardduty.ArchiveFindings
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-filter
          description: Create a finding filter to suppress or flag findings
          hints:
            readOnly: false
          call: amazon-guardduty.CreateFilter
          outputParameters:
            - type: object
              mapping: "$."
