tags:
- name: Invitation
paths:
  /invitation/decline:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeclineInvitations
      description: Declines invitations sent to the current member account by Amazon Web Services accounts specified by their account IDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineInvitationsResponse'
              examples:
                DeclineInvitations200Example:
                  summary: Default DeclineInvitations 200 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '480':
          description: BadRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
              examples:
                DeclineInvitations480Example:
                  summary: Default DeclineInvitations 480 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '481':
          description: InternalServerErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
              examples:
                DeclineInvitations481Example:
                  summary: Default DeclineInvitations 481 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountIds
              properties:
                accountIds:
                  description: A list of account IDs of the Amazon Web Services accounts that sent invitations to the current member account that you want to decline invitations from.
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountId'
                  minItems: 1
                  maxItems: 50
      summary: Amazon GuardDuty Decline Invitations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Invitation
  /invitation/delete:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteInvitations
      description: Deletes invitations sent to the current member account by Amazon Web Services accounts specified by their account IDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInvitationsResponse'
              examples:
                DeleteInvitations200Example:
                  summary: Default DeleteInvitations 200 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '480':
          description: BadRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
              examples:
                DeleteInvitations480Example:
                  summary: Default DeleteInvitations 480 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '481':
          description: InternalServerErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
              examples:
                DeleteInvitations481Example:
                  summary: Default DeleteInvitations 481 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountIds
              properties:
                accountIds:
                  description: A list of account IDs of the Amazon Web Services accounts that sent invitations to the current member account that you want to delete invitations from.
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountId'
                  minItems: 1
                  maxItems: 50
      summary: Amazon GuardDuty Delete Invitations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Invitation
  /invitation/count:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: GetInvitationsCount
      description: Returns the count of all GuardDuty membership invitations that were sent to the current member account except the currently accepted invitation.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvitationsCountResponse'
              examples:
                GetInvitationsCount200Example:
                  summary: Default GetInvitationsCount 200 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '480':
          description: BadRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
              examples:
                GetInvitationsCount480Example:
                  summary: Default GetInvitationsCount 480 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '481':
          description: InternalServerErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
              examples:
                GetInvitationsCount481Example:
                  summary: Default GetInvitationsCount 481 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
      parameters: []
      summary: Amazon GuardDuty Get Invitations Count
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Invitation
  /invitation:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListInvitations
      description: Lists all GuardDuty membership invitations that were sent to the current Amazon Web Services account.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvitationsResponse'
              examples:
                ListInvitations200Example:
                  summary: Default ListInvitations 200 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '480':
          description: BadRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
              examples:
                ListInvitations480Example:
                  summary: Default ListInvitations 480 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
        '481':
          description: InternalServerErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
              examples:
                ListInvitations481Example:
                  summary: Default ListInvitations 481 response
                  x-microcks-default: true
                  value:
                    detectorId: abc123
                    format: DNS_LOGS
      parameters:
      - name: maxResults
        in: query
        required: false
        description: You can use this parameter to indicate the maximum number of items that you want in the response. The default value is 50. The maximum value is 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: nextToken
        in: query
        required: false
        description: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the list action. For subsequent calls to the action, fill nextToken in the request with the value of NextToken from the previous response to continue listing data.
        schema:
          type: string
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      summary: Amazon GuardDuty List Invitations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Invitation
components:
  schemas:
    GetInvitationsCountResponse:
      type: object
      properties:
        InvitationsCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - xml:
              name: invitationsCount
            description: The number of received invitations.
    UnprocessedAccounts:
      type: array
      items:
        $ref: '#/components/schemas/UnprocessedAccount'
      minItems: 0
      maxItems: 50
    UnprocessedAccount:
      type: object
      required:
      - AccountId
      - Result
      properties:
        AccountId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - xml:
              name: accountId
            description: The Amazon Web Services account ID.
        Result:
          allOf:
          - $ref: '#/components/schemas/String'
          - xml:
              name: result
            description: A reason why the account hasn't been processed.
      description: Contains information about the accounts that weren't processed.
    BadRequestException: {}
    Invitation:
      type: object
      properties:
        AccountId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - xml:
              name: accountId
            description: The ID of the account that the invitation was sent from.
        InvitationId:
          allOf:
          - $ref: '#/components/schemas/String'
          - xml:
              name: invitationId
            description: The ID of the invitation. This value is used to validate the inviter account to the member account.
        RelationshipStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - xml:
              name: relationshipStatus
            description: The status of the relationship between the inviter and invitee accounts.
        InvitedAt:
          allOf:
          - $ref: '#/components/schemas/String'
          - xml:
              name: invitedAt
            description: The timestamp when the invitation was sent.
      description: Contains information about the invitation to become a member account.
    DeleteInvitationsResponse:
      type: object
      required:
      - UnprocessedAccounts
      properties:
        UnprocessedAccounts:
          allOf:
          - $ref: '#/components/schemas/UnprocessedAccounts'
          - xml:
              name: unprocessedAccounts
            description: A list of objects that contain the unprocessed account and a result string that explains why it was unprocessed.
    Invitations:
      type: array
      items:
        $ref: '#/components/schemas/Invitation'
      minItems: 0
      maxItems: 50
    Integer:
      type: integer
    DeclineInvitationsResponse:
      type: object
      required:
      - UnprocessedAccounts
      properties:
        UnprocessedAccounts:
          allOf:
          - $ref: '#/components/schemas/UnprocessedAccounts'
          - xml:
              name: unprocessedAccounts
            description: A list of objects that contain the unprocessed account and a result string that explains why it was unprocessed.
    InternalServerErrorException: {}
    String:
      type: string
    ListInvitationsResponse:
      type: object
      properties:
        Invitations:
          allOf:
          - $ref: '#/components/schemas/Invitations'
          - xml:
              name: invitations
            description: A list of invitation descriptions.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - xml:
              name: nextToken
            description: The pagination parameter to be used on the next list operation to retrieve more items.
    AccountId:
      type: string
      minLength: 12
      maxLength: 12
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
